<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Dinamis Bootstrap</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .input-group-custom {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Data Input Dinamis</h5>
                    </div>
                    <div class="card-body">

                        <!-- Wadah untuk kolom-kolom input -->
                        <div id="input-container">
                            <div class="mb-3 input-group-custom">
                                <label class="form-label">Nama Kolom</label>
                                <input type="text" name="kolom[]" class="form-control" placeholder="Masukkan data...">
                            </div>
                        </div>

                        <hr>

                        <!-- Tombol Tambah -->
                        <div class="d-grid gap-2">
                            <button type="button" id="add-btn" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Tambah Kolom Baru
                            </button>
                            <button type="submit" class="btn btn-primary mt-2">Simpan Data</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('input-container');
        const addBtn = document.getElementById('add-btn');

        addBtn.addEventListener('click', () => {
            // Membuat div wrapper dengan class Bootstrap
            const newDiv = document.createElement('div');
            newDiv.classList.add('mb-3', 'input-group', 'input-group-custom');

            // HTML untuk input dan tombol hapus di sampingnya
            newDiv.innerHTML = `
                <input type="text" name="kolom[]" class="form-control" placeholder="Masukkan data...">
                <button class="btn btn-outline-danger" type="button" onclick="this.parentElement.remove()">
                    Hapus
                </button>
            `;

            container.appendChild(newDiv);
        });
    </script>

</body>

</html>
