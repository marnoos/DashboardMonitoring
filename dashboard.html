<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Akademik Responsif</title>
    <!-- Link CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }

        /* Menyembunyikan sidebar di mobile */
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR (Pola: Off-Canvas/Hidden on Mobile) -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <h5 class="px-3">Menu Utama</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Data Mahasiswa</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Laporan Nilai</a></li>
                    </ul>
                </div>
            </nav>

            <!-- MAIN CONTENT -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Header (Hirarki Konten) -->
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Ringkasan Akademik</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button class="btn btn-sm btn-primary">Unduh Laporan</button>
                    </div>
                </div>

                <!-- STATS CARDS (Pola: Column Drop) -->
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="card p-3 shadow-sm border-primary">
                            <h6>Total Mahasiswa</h6>
                            <h3>1,240</h3>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="card p-3 shadow-sm border-success">
                            <h6>Rata-rata IPK</h6>
                            <h3>3.45</h3>
                        </div>
                    </div>
                    <!-- Card ini akan turun ke bawah jika di layar mobile -->
                </div>

                <!-- PANEL DETAIL (Pola: Panel Expansion) -->
                <div class="row mt-4">
                    <div class="col-12 col-lg-8">
                        <div class="card p-4 mb-3">
                            <h5>Grafik Keaktifan Mahasiswa</h5>
                            <div
                                style="height: 200px; background: #eee; display:flex; align-items:center; justify-content:center;">
                                [Area Visualisasi Data]
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div class="card p-4">
                            <h5>Log Aktivitas</h5>
                            <ul class="list-unstyled">
                                <li><small>10 Menit lalu: Input nilai MK IMK</small></li>
                                <li><small>1 Jam lalu: Update KRS mahasiswa</small></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
