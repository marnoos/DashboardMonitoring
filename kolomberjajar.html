<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Berjajar Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Form Input Berjajar</h5>
            </div>
            <div class="card-body">

                <form>
                    <!-- Container Utama -->
                    <div id="input-container">
                        <!-- Baris Pertama (Default) -->
                        <div class="row g-2 mb-3 align-items-center">
                            <div class="col">
                                <input type="text" name="label[]" class="form-control" placeholder="Label">
                            </div>
                            <div class="col">
                                <input type="text" name="value[]" class="form-control" placeholder="Nilai/Value">
                            </div>
                            <div class="col-auto">
                                <!-- Spacer agar sejajar dengan baris yang punya tombol hapus -->
                                <div style="width: 45px;"></div>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="add-btn" class="btn btn-outline-primary btn-sm">
                        + Tambah Baris
                    </button>

                    <hr>
                    <button type="submit" class="btn btn-success w-100">Simpan Data</button>
                </form>

            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('input-container');
        const addBtn = document.getElementById('add-btn');

        addBtn.addEventListener('click', () => {
            // Membuat elemen div row baru
            const newRow = document.createElement('div');
            newRow.classList.add('row', 'g-2', 'mb-3', 'align-items-center');

            // Struktur HTML untuk dua kolom input dan satu tombol hapus
            newRow.innerHTML = `
                <div class="col">
                    <input type="text" name="label[]" class="form-control" placeholder="Label">
                </div>
                <div class="col">
                    <input type="text" name="value[]" class="form-control" placeholder="Nilai/Value">
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-danger" onclick="this.closest('.row').remove()">
                        &times;
                    </button>
                </div>
            `;

            container.appendChild(newRow);
        });
    </script>

</body>

</html>
