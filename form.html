<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Responsif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
        }

        /* Mengoptimalkan kenyamanan sentuh */
        .form-control,
        .form-select {
            min-height: 48px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2 class="mb-4 text-center">Formulir Profil Pengguna</h2>

        <form class="row g-3">
            <!-- Baris 1: Nama Depan & Belakang (2 kolom di desktop, 1 di mobile) -->
            <div class="col-md-6">
                <label for="firstName" class="form-label">Nama Depan</label>
                <input type="text" class="form-control" id="firstName" placeholder="Contoh: Budi">
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Nama Belakang</label>
                <input type="text" class="form-control" id="lastName" placeholder="Contoh: Santoso">
            </div>

            <!-- Baris 2: Email (Penuh) -->
            <div class="col-12">
                <label for="email" class="form-label">Alamat Email</label>
                <input type="email" class="form-control" id="email" placeholder="nama@email.com">
            </div>

            <!-- Baris 3: Program Studi & Kelas (Pola Layout Shifter) -->
            <div class="col-md-8">
                <label for="prodi" class="form-label">Program Studi</label>
                <select id="prodi" class="form-select">
                    <option selected>Pilih Program Studi...</option>
                    <option>Teknik Informatika</option>
                    <option>Sistem Informasi</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="kelas" class="form-label">Kelas</label>
                <input type="text" class="form-control" id="kelas" placeholder="Misal: IF-01">
            </div>

            <!-- Baris 4: Catatan Tambahan -->
            <div class="col-12">
                <label for="notes" class="form-label">Catatan Tambahan</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
            </div>

            <!-- Tombol Aksi (Full width di mobile) -->
            <div class="col-12 d-grid d-md-block text-end">
                <button type="reset" class="btn btn-outline-secondary me-md-2 mb-2 mb-md-0">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Data</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
